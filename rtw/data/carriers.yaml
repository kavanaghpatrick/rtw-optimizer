# oneworld alliance carrier reference data
# YQ tiers: very_low < low < medium < high < very_high
#
# rtw_booking_classes: Rule 3015 §5(b) booking codes (27 FEB 2026 filing) by fare
#   cabin -- first (AONE*), business (DONE*), ione3 (IONE3), economy (LONE*).
# rtw_booking_classes_domestic: override used when both airports are in the
#   same country (AY domestic, JL/NU domestic). Absent = same as international.
# rtw_fallback_class: business (DONE*) class when the primary is sold out
#   (B, or H on AA). First fares fall back to Y for every carrier (rtw/carriers.py).

AA:
  name: American Airlines
  alliance: oneworld
  eligible: true
  ntp_method: revenue
  yq_tier: low
  yq_estimate_per_segment: 50
  rtw_booking_classes: {first: A, business: D, ione3: I, economy: L}
  rtw_fallback_class: H   # AA falls back to H (NOT B) when D sold out — Rule 3015
  notes: "Revenue-based NTP. Business books D (primary); H only as fallback when D is sold out."

