# oneworld Explorer base-fare OVERRIDES.
#
# Base fares come from rtw/data/fares.db (the filed-fare dump built from
# rtw_fares_all.xlsx by scripts/build_fares_db.py). rtw.cost.FareSource returns
# the cheapest filed fare (MIN fare_usd) per origin and fare basis, with the
# carrier that files it. Origins or fare bases with no filed row return nothing:
# no estimates, no multipliers.
#
# Add an entry here only when you hold a newer verified quote that should win
# over fares.db. Every entry must give fare_usd and name its source; the loader
# rejects entries without one. Keys are airport or city codes (LHR/LGW -> LON,
# NRT/HND -> TYO).
#
# Example:
#   overrides:
#     OSL:
#       DONE3: {fare_usd: 5386, carrier: QR, source: "AA RTW desk quote 2026-07-19"}
#
# The hand-estimated per-origin table that used to live here (CAI DONE4 $4,000,
# AONE at 1.6x DONE, etc.) was removed on 2026-11-16: it was 10-160% off the
# filed fares for 7 of 8 origins.

overrides: {}
