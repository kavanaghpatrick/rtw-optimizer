# oneworld Explorer continent definitions
# Based on IATA Tariff Conferences and Rule 3015

# Airport-to-continent overrides (edge cases that differ from country defaults)
overrides:
  CAI: EU_ME       # Egypt = Europe/Middle East (NOT Africa)
  ALY: EU_ME       # Alexandria, Egypt
  HRG: EU_ME       # Hurghada, Egypt
  SSH: EU_ME       # Sharm El Sheikh, Egypt
  LXR: EU_ME       # Luxor, Egypt
  ALA: Asia        # Almaty, Kazakhstan = Asia (TC3). oneworld Explorer rules: "The continent of Asia includes Kazakhstan, Kyrgyzstan, Russia east of the Urals, Tajikistan, Turkmenistan and Uzbekistan" (oneworld FAQ PDF); IATA also puts KZ in TC3 South East Asia
  NQZ: Asia        # Astana, Kazakhstan = Asia (TC3), same basis as ALA
  GUM: Asia        # Guam = Asia (TC3 SE Asia), NOT North America despite US territory
  # Russia boundary airports (see russia_urals_longitude). IATA country code RU
  # covers Russia "west from and including the Ural Mountains", so cities in the
  # Urals themselves stay Europe even though they sit just east of 60E.
  SVX: EU_ME       # Yekaterinburg (60.8E), Middle Urals
  CEK: EU_ME       # Chelyabinsk (61.5E), eastern Urals foothills
  VKT: EU_ME       # Vorkuta (64.0E), Komi Republic, west of the Polar Urals ridge
  MEX: N_America   # Mexico = North America
  CUN: N_America   # Cancun, Mexico
  GDL: N_America   # Guadalajara, Mexico
  HNL: N_America   # Hawaii = North America
  OGG: N_America   # Maui, Hawaii
  KOA: N_America   # Kona, Hawaii
  LIH: N_America   # Kauai, Hawaii
  IST: EU_ME       # Istanbul, Turkey
  DOH: EU_ME       # Doha, Qatar
  AMM: EU_ME       # Amman, Jordan
  RUH: EU_ME       # Riyadh, Saudi Arabia
  JED: EU_ME       # Jeddah, Saudi Arabia
  BAH: EU_ME       # Bahrain
  KWI: EU_ME       # Kuwait
  MCT: EU_ME       # Muscat, Oman
  NAN: SWP         # Nadi, Fiji = South West Pacific
  SUV: SWP         # Suva, Fiji
  FUN: SWP         # Funafuti, Tuvalu
  TRW: SWP         # Tarawa, Kiribati
  PPT: SWP         # Papeete, Tahiti
  APW: SWP         # Apia, Samoa
  AKL: SWP         # Auckland, New Zealand
  WLG: SWP         # Wellington, New Zealand
  CHC: SWP         # Christchurch, New Zealand
  SYD: SWP         # Sydney, Australia
  MEL: SWP         # Melbourne, Australia
  BNE: SWP         # Brisbane, Australia
  PER: SWP         # Perth, Australia
  ADL: SWP         # Adelaide, Australia
  CNS: SWP         # Cairns, Australia
  DRW: SWP         # Darwin, Australia
  NOU: SWP         # Noumea, New Caledonia
  VLI: SWP         # Port Vila, Vanuatu
  TBU: SWP         # Tongatapu, Tonga

# Country-to-continent defaults.
#
# Sources, in priority order:
#   1. 01-fare-rules.md §3 (oneworld Explorer continent definitions). Where it
#      names a country explicitly it wins, even against IATA (e.g. Libya is in
#      IATA "Within Africa" but oneworld puts it in Europe/Middle East; Panama is
#      IATA "South America" but oneworld puts it in North America).
#   2. IATA "Provisions for the Conduct of the IATA Traffic Conferences", First
#      Schedule (sub-area country lists), for countries the rule text covers
#      only by region ("All of Europe", "Middle East", "Caribbean",
#      "SE Asia", "Pacific Islands").
#
# Russia (RU) is deliberately NOT listed: it is split at the Urals and resolved
# by airport longitude in rtw/continents.py (see russia_urals_longitude below).
#
# Deliberately unmapped (rule text silent and IATA sub-area does not settle the
# oneworld continent): AQ, EH, FK, GL, SH, SS, TL, UM. Airports there resolve to
# None and the validator reports "Unknown continent" instead of guessing.
countries:
  # TC2 - Europe/Middle East
  EU_ME:
    # IATA "Within Europe" sub-area (01-fare-rules.md §3: "All of Europe")
    - AD
    - AL
    - AM
    - AT
    - AX  # Aland Islands (Finland)
    - AZ
    - BA
    - BE
    - BG
    - BY
    - CH
    - CY
    - CZ
    - DE
    - DK
    - DZ
    - EE
    - ES
    - FI
    - FO  # Faroe Islands (Denmark)
    - FR
    - GB
    - GE
    - GG  # Guernsey
    - GI
    - GR
    - HR
    - HU
    - IE
    - IM  # Isle of Man
    - IS
    - IT
    - JE  # Jersey
    - LI
    - LT
    - LU
    - LV
    - MA
    - MC
    - MD
    - ME
    - MK
    - MT
    - NL
    - "NO"  # YAML parses bare NO as boolean False — must quote
    - PL
    - PT
    - RO
    - RS
    - SE
    - SI
    - SK
    - SM
    - TN
    - TR
    - UA
    - XK  # Kosovo
    # IATA "Within Middle East" sub-area (01-fare-rules.md §3: "Middle East",
