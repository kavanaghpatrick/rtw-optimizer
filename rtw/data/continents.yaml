# Russia straddles Europe/Middle East and Asia. 01-fare-rules.md §3: Europe/
# Middle East includes "Russia west of Urals", Asia includes "Russia east of
# Urals". IATA codes this as RU ("west from and including the Ural Mountains")
# and XU ("east of, not including, the Urals"). Russian airports east of this
# longitude resolve to Asia, the rest to EU_ME. Airports in the mountains
# themselves, or where the Polar Urals bend east, are pinned in `overrides`.
russia_urals_longitude: 60.0

# Sub-area lists used by the open-jaw check (Rule 3015 §18 "Within the Middle
# East" / "Within Africa"). Africa reuses countries.Africa. Every code here must
# also appear under countries.EU_ME (checked at import).
middle_east:
  - AE
  - BH
  - EG
  - IL
  - IQ
  - JO
  - KW
  - LB
  - OM
  - PS
  - QA
  - SA
  - SY
  - YE

# Tariff conference assignments
tariff_conferences:
  TC1:
    - N_America
    - S_America
  TC2:
    - EU_ME
    - Africa
  TC3:
    - Asia
    - SWP

# Per-continent segment limits (after departing origin continent)
segment_limits:
  EU_ME: 4
  Africa: 4
  Asia: 4
  SWP: 4
  N_America: 6
  S_America: 4
