  # TC3 - Asia (IATA South Asian Subcontinent, South East Asia and
  # Japan/Korea sub-areas). Russia east of the Urals is handled in code.
  Asia:
    # Japan/Korea
    - JP
    - KR
    - KP
    # South Asian Subcontinent
    - AF
    - BD
    - BT
    - IN
    - LK
    - MV
    - NP
    - PK
    # South East Asia
    - BN
