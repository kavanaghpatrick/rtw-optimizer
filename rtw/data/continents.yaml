    - BH
    - EG
    - IL
    - IQ
    - IR
    - JO
    - KW
    - LB
    - OM
    - PS
    - QA
    - SA
    - SD
    - SY
    - YE
    # Named explicitly in 01-fare-rules.md §3 (IATA has Libya in Africa)
    - LY

  # TC2 - Africa (Sub-Saharan). IATA "Within Africa" sub-area minus Libya,
