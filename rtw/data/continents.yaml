    - KZ
    - KG
    - TJ
    - TM
    - UZ
    # North Pacific islands. 01-fare-rules.md §19 puts Guam in the TC3 South
    # East Asia sub-area; the IATA First Schedule lists Guam, Marshall Islands,
    # Micronesia, Northern Mariana Islands and Palau together in that sub-area.
    - GU  # Guam
    - FM  # Micronesia (PNI, TKK, KSA, YAP)
    - MH  # Marshall Islands (MAJ, KWA)
    - MP  # Northern Mariana Islands (SPN)
    - PW  # Palau (ROR)

  # TC3 - South West Pacific (IATA "South West Pacific" sub-area)
  SWP:
