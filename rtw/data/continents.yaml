    - BS
    - CU
    - CW
    - DM
    - DO
    - GD
    - GP
    - HT
    - JM
    - KN
    - KY
    - LC
    - MF  # St Martin (French side)
    - MQ
    - MS
    - PR  # Puerto Rico (airportsdata files it under US; listed for safety)
    - SX
    - TC
    - TT
    - VC
    - VG
    - VI  # US Virgin Islands (airportsdata files it under US; listed for safety)

  # TC1 - South America ("All of South America south of Panama")
  S_America:
    - AR
    - BO
    - BR
    - CL
    - CO
    - EC
    - GF  # French Guiana
    - GY
    - PE
    - PY
    - SR
    - UY
