    to: JFK
    carrier: BA
    date: "2026-06-06"
    type: stopover

  # Pacific crossing (westbound)
  - from: JFK
    to: SYD
    carrier: QF
    date: "2026-06-10"
    type: stopover

  # SWP -> EU_ME (return leg)
  - from: SYD
    to: DOH
    carrier: QR
    date: "2026-06-14"
    type: transit

  # DOH->LHR pair occurrence #2! -> VIOLATION
  - from: DOH
    to: LHR
    carrier: BA
    date: "2026-06-15"
    type: stopover
    notes: "DOH->LHR pair #2 -> DUPLICATE CITY-PAIR VIOLATION"

  # Return to origin
  - from: LHR
    to: CAI
    carrier: BA
    date: "2026-06-18"
    type: final
