# Second: DOH->LHR (return leg, same pair same direction)
# Tests: CityPairDirectionRule VIOLATION

ticket:
  type: DONE4
  cabin: business
  origin: CAI
  passengers: 1
  departure: "2026-06-01"

segments:
  # EU_ME internal
  - from: CAI
    to: DOH
    carrier: RJ
    date: "2026-06-01"
    type: transit

  # DOH->LHR pair occurrence #1
  - from: DOH
    to: LHR
    carrier: QR
    date: "2026-06-02"
